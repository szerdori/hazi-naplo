# Reggel és este 20 percenként lefut, és elküldi azoknak a telefonoknak az értesítést, amelyeknél elérkezett a beállított időpont.
# Az időpontok UTC-ben vannak, és télen-nyáron is lefedik a budapesti 6:00–11:00 (reggel) és 17:00–24:00 (este) közötti időt.
# Páratlan percek (:07, :27, :47): a GitHub ütemezője a kerek perceken a legterheltebb, ott késik a legtöbbet.
name: Esti értesítés

on:
  schedule:
    - cron: '7,27,47 4-9 * * *'
    - cron: '7,27,47 15-22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esti-ertesites
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - run: node notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: https://szerdori.github.io/hazi-naplo/
